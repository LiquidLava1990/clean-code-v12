[graph]
all-features = true

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
ignore = [
    # Unmaintained (no vulnerability, no safe upgrade). bincode backs the
    # on-disk CPG cache format and chrono the baseline timestamps; both
    # need a format-compatible migration before they can be dropped.
    { id = "RUSTSEC-2025-0141", reason = "bincode unmaintained; CPG cache codec migration tracked" },
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; timestamp migration tracked" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "MPL-2.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
# Workspace crates depend on each other by path without a version, which
# cargo-deny reports as a wildcard. Registry deps all carry versions via
# [workspace.dependencies]; give path deps versions before crates.io publish.
wildcards = "allow"
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
