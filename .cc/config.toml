# Clean Code V12 — repo self-host configuration
# Loaded by `ccv12 check .` to scope which paths the kernel scans.

[project]
name = "clean-code-v12"
languages = ["rust"]
marker = ".cc/config.toml"

[ignore]
# Test-fixture trees contain INTENTIONAL rule violations so kernel
# integration tests can verify rule behaviour. Excluding them from
# self-host scans is correctness, not noise suppression.
paths = [
    "**/tests/fixtures/**",
    "**/test-fixtures/**",
    "crates/cc-test-fixtures/tests/fixtures/**",
    # G2 reference corpus — third-party repos cloned for benchmarking; not our code.
    "corpus/**",
    # Editor integrations follow each editor's idiomatic style (JS/TS/JSON)
    # rather than the Rust-kernel discipline this project's self-host gates;
    # they ship with their own per-language linters configured in their dirs.
    "editors/**",
    # `ccv12 harness` ships its Python templates as embedded string literals
    # (`include_str!`) inside the cc-cli binary. They are payloads, not
    # source — the runtime equivalents are scanned in the host repo where
    # `ccv12 harness init` was run.
    "crates/cc-cli/harness_templates/**",
]
generated = true
vendored = true
extensions = ["lock", "snap"]

# [baseline] — opt-in. Run with `ccv12 check --baseline <ref>` to enable diff mode.
