# Clean Code V12 — pre-commit framework integration.
#
# Discovered by https://pre-commit.com when this repo is added as a
# `repos:` source. `language: rust` runs `cargo install --path .` at the
# repo root, which builds the root package's `ccv12-pre-commit` binary (the
# same CLI as `ccv12`, see tools/pre-commit/main.rs) inside the hook
# environment. `ccv12 check` scans the repository as a whole (cross-file
# rules need the full tree), so filenames are not passed. The first run
# compiles the linter (a few minutes); later runs reuse the cached
# environment.
#
# Usage in a downstream `.pre-commit-config.yaml`:
#
#   repos:
#     - repo: https://github.com/LiquidLava1990/clean-code-v12
#       rev: v0.1.0
#       hooks:
#         - id: ccv12-lint          # warn at required+
#         - id: ccv12-lint-blocker  # CI gate — blockers only

- id: ccv12-lint
  name: Clean Code V12 linter
  description: Run ccv12 check on the repository at required severity (developer feedback).
  entry: ccv12-pre-commit check
  language: rust
  types: [text]
  pass_filenames: false
  args: [--severity, required, .]

- id: ccv12-lint-blocker
  name: Clean Code V12 (blocker only)
  description: Run ccv12 check at blocker severity — suitable as a CI merge gate.
  entry: ccv12-pre-commit check
  language: rust
  types: [text]
  pass_filenames: false
  args: [--severity, blocker, .]
