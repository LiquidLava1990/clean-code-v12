name: release

# Builds prebuilt `cc` + `cc-lsp` binaries for every supported platform,
# attaches them (plus the one-line installers and SHA-256 checksums) to a
# GitHub Release, and pushes the rule-pack manifests to GHCR.
#
# Trigger: push a tag that starts with `v` (e.g. `v0.1.0`). Tags with a
# pre-release suffix (`v0.1.0-rc.1`) produce a pre-release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build a release for"
        required: true

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-pc-windows-msvc,      os: windows-latest, tool: cargo }
          - { target: x86_64-unknown-linux-musl,   os: ubuntu-latest,  tool: zigbuild }
          - { target: aarch64-unknown-linux-musl,  os: ubuntu-latest,  tool: zigbuild }
          - { target: aarch64-apple-darwin,        os: macos-latest,   tool: cargo }
          - { target: x86_64-apple-darwin,         os: macos-latest,   tool: cargo }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Rust toolchain (pinned by rust-toolchain.toml)
        shell: bash
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install zig + cargo-zigbuild
        if: matrix.tool == 'zigbuild'
        run: |
          python3 -m pip install --user ziglang==0.13.0
          cargo install --locked cargo-zigbuild@0.19.8

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.tool }}" = zigbuild ]; then
            cargo zigbuild --release --locked --target ${{ matrix.target }} -p cc-cli -p cc-lsp
          else
            cargo build --release --locked --target ${{ matrix.target }} -p cc-cli -p cc-lsp
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          target='${{ matrix.target }}'
          name="cc-${target}"
          stage="dist/${name}"
          mkdir -p "$stage"
          ext=""
          case "$target" in *windows*) ext=".exe" ;; esac
          cp "target/${target}/release/cc${ext}" "target/${target}/release/cc-lsp${ext}" "$stage/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$stage/"
          cd dist
          if [ -n "$ext" ]; then
            7z a -tzip "${name}.zip" "${name}" > /dev/null
            archive="${name}.zip"
          else
            tar -czf "${name}.tar.gz" "${name}"
            archive="${name}.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi
          echo "archive=dist/${archive}" >> "$GITHUB_OUTPUT"

      - name: Smoke-test native binary
        if: matrix.target != 'aarch64-unknown-linux-musl' && matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          ext=""; case '${{ matrix.target }}' in *windows*) ext=".exe" ;; esac
          "target/${{ matrix.target }}/release/cc${ext}" --version

      - uses: actions/upload-artifact@v4
        with:
          name: cc-${{ matrix.target }}
          path: |
            ${{ steps.package.outputs.archive }}
            ${{ steps.package.outputs.archive }}.sha256

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Collect checksums
        run: |
          cp install.sh install.ps1 dist/
          cd dist
          cat *.sha256 > SHA256SUMS
          ls -l

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          prerelease=""
          case "$RELEASE_TAG" in *-*) prerelease="--prerelease" ;; esac
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --title "$RELEASE_TAG" --generate-notes $prerelease
          fi

  packs:
    name: push rule-pack manifests to GHCR
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oras-project/setup-oras@v1
        with:
          version: 1.2.0

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push every packs/*.oci.json
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          for manifest in packs/*.oci.json; do
            name="$(jq -r .name "$manifest")"
            version="$(jq -r .version "$manifest")"
            media="$(jq -r .mediaType "$manifest")"
            ref="ghcr.io/${owner}/${name}:${version}"
            (cd packs && oras push "$ref" --artifact-type "$media" \
              --annotation "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
              "$(basename "$manifest"):application/json")
            echo "pushed $ref"
          done
