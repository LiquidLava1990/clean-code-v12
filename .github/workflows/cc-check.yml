name: cc-check

# Clean Code V12 — distribution-surface workflow.
#
# Two jobs:
#   1. `scan` runs on every push + PR, builds the cc binary, scans the
#      repo, and uploads SARIF to the GitHub Security tab.
#   2. `review` runs on PRs only, produces a baseline-relative rdjson
#      stream, and posts findings as inline review comments via
#      reviewdog.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: cc-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write
  checks: write

jobs:
  scan:
    name: cc check (full repo, SARIF)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cc-check-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cc-check-cargo-${{ runner.os }}-

      - name: Build cc binary
        run: cargo build --release -p cc-cli

      - name: cc check (SARIF)
        run: ./target/release/cc check . --format sarif --output cc-results.sarif

      - name: Upload SARIF to GitHub code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: cc-results.sarif
          category: clean-code-v12

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cc-results-sarif
          path: cc-results.sarif

  review:
    name: cc check (PR review comments)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@1.85

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cc-check-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cc-check-cargo-${{ runner.os }}-

      - name: Build cc binary
        run: cargo build --release -p cc-cli

      # cc-cli today expects --baseline to point at a JSON baseline
      # produced from a previous run on the merge-base. Here we
      # synthesise one by checking out origin/main, scanning it to JSON,
      # then returning to the PR head and feeding that JSON to the diff
      # invocation.
      - name: Build baseline against merge-base
        run: |
          git fetch origin main --depth=50
          MERGE_BASE=$(git merge-base origin/main HEAD)
          git checkout "$MERGE_BASE" --
          ./target/release/cc check . --format json --output cc-baseline.json || true
          git checkout - --

      - name: cc check (rdjson, baseline-aware)
        run: ./target/release/cc check . --baseline cc-baseline.json --format rdjson > cc-diff.rdjson

      - name: Setup reviewdog
        uses: reviewdog/action-setup@v1
        with:
          reviewdog_version: latest

      - name: Post findings as PR review comments
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          reviewdog -f=rdjson -name="clean-code-v12" -reporter=github-pr-review -fail-on-error=false < cc-diff.rdjson
