[package]
name = "cc-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Fast code quality linter and static analysis CLI for Python, JavaScript, TypeScript, Go and Rust: 391 checks, SARIF output, baselines, pre-commit."
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords = ["linter", "static-analysis", "code-quality", "sast", "cli"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "ccv12"
path = "src/main.rs"

[lib]
name = "cc_cli"
path = "src/lib.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
clap = { workspace = true, features = ["derive"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
camino.workspace = true
owo-colors.workspace = true
cc-kernel = { path = "../cc-kernel" }
cc-config = { path = "../cc-config" }
cc-finding = { path = "../cc-finding" }
cc-rules = { path = "../cc-rules" }
cc-rules-tier0 = { path = "../cc-rules-tier0" }
cc-sarif = { path = "../cc-sarif" }
cc-rdformat = { path = "../cc-rdformat" }
cc-baseline = { path = "../cc-baseline" }
cc-score = { path = "../cc-score" }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
