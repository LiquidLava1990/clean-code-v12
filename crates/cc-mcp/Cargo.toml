[package]
name = "cc-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Clean Code V12 — Model Context Protocol (MCP) server (stdio JSON-RPC)."

[[bin]]
name = "cc-mcp"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
camino.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
tempfile.workspace = true
cc-config = { path = "../cc-config" }
cc-finding = { path = "../cc-finding" }
cc-kernel = { path = "../cc-kernel" }
cc-rules = { path = "../cc-rules" }
cc-frontend = { path = "../cc-frontend" }
# Built-in pack crates so `cc_list_rules` / `cc_get_rule` can mirror
# the kernel's default pack set without touching kernel internals.
cc-rules-tier0 = { path = "../cc-rules-tier0" }
cc-rules-slop = { path = "../cc-rules-slop" }
cc-rules-secrets = { path = "../cc-rules-secrets" }
cc-rules-perf = { path = "../cc-rules-perf" }
cc-rules-completeness = { path = "../cc-rules-completeness" }
cc-rules-bugs = { path = "../cc-rules-bugs" }
cc-rules-concurrency = { path = "../cc-rules-concurrency" }
cc-rules-time-math = { path = "../cc-rules-time-math" }
cc-rules-taint = { path = "../cc-rules-taint" }
cc-rules-memory = { path = "../cc-rules-memory" }
cc-rules-types = { path = "../cc-rules-types" }
cc-rules-architecture = { path = "../cc-rules-architecture" }
cc-rules-tests = { path = "../cc-rules-tests" }
cc-rules-database = { path = "../cc-rules-database" }
cc-rules-anti-fragility = { path = "../cc-rules-anti-fragility" }
cc-rules-observability = { path = "../cc-rules-observability" }
cc-rules-api = { path = "../cc-rules-api" }
cc-rules-deploy = { path = "../cc-rules-deploy" }
cc-rules-ops = { path = "../cc-rules-ops" }
cc-rules-ci = { path = "../cc-rules-ci" }
cc-rules-history = { path = "../cc-rules-history" }
cc-rules-docs = { path = "../cc-rules-docs" }
cc-rules-compliance = { path = "../cc-rules-compliance" }
cc-rules-i18n-a11y = { path = "../cc-rules-i18n-a11y" }
cc-rules-modernize = { path = "../cc-rules-modernize" }
cc-rules-test-design = { path = "../cc-rules-test-design" }
cc-rules-supplychain = { path = "../cc-rules-supplychain" }
cc-rules-formatting = { path = "../cc-rules-formatting" }
cc-rules-iac = { path = "../cc-rules-iac" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time"] }

[lints]
workspace = true
