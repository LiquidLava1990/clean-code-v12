[package]
name = "cc-incremental"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
tracing.workspace = true
camino.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
notify.workspace = true
salsa.workspace = true

cc-cpg = { path = "../cc-cpg" }
cc-cpg-store = { path = "../cc-cpg-store" }
cc-frontend = { path = "../cc-frontend" }
cc-finding = { path = "../cc-finding" }
cc-rules = { path = "../cc-rules" }
cc-config = { path = "../cc-config" }
tree-sitter.workspace = true
tree-sitter-rust.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "fs", "test-util"] }

[lints.rust]
# Workspace forbids unsafe; this crate must override to `deny` because Salsa's
# `Update` trait is `unsafe` by design (see `queries::wrappers` for the two
# isolated impls). All `unsafe` blocks are documented + locally `# Safety`'d.
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "deny"
